<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>32 位球星图片核验</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px 60px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7f6;color:#333}
  h1{margin:0 0 8px;font-size:24px;text-align:center}
  .subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:1400px;margin:0 auto}
  .card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .code{font-size:22px;font-weight:800;color:#1faa6a}
  .gender{font-size:12px;padding:2px 8px;border-radius:999px;background:#eef2f1;color:#666}
  .name{font-weight:600;font-size:15px}
  .previews{display:flex;gap:10px;align-items:flex-start}
  .preview{flex:1}
  .label{font-size:11px;color:#888;margin-bottom:4px}
  .circle-wrap{width:80px;height:80px;border-radius:50%;overflow:hidden;background:#eef2f1;margin:0 auto}
  .circle-wrap img{width:100%;height:100%;object-fit:cover}
  .wide-wrap{width:100%;height:72px;border-radius:8px;overflow:hidden;background:#eef2f1}
  .wide-wrap img{width:100%;height:100%;object-fit:cover}
  .full{width:100%;height:80px;border-radius:8px;overflow:hidden;background:#eef2f1;margin-top:8px}
  .full img{width:100%;height:100%;object-fit:cover}
  .note{max-width:1400px;margin:28px auto 0;font-size:13px;color:#666;background:#fff;padding:14px 16px;border-radius:10px;line-height:1.7}
  .note b{color:#333}
</style>
</head>
<body>
<h1>32 位本命球星图片核验</h1>
<p class="subtitle">左列 = 圆形头像(132rpx)效果；中列 = 卡片顶部宽图(360rpx高)效果；右列 = 裁剪后原图</p>
<div class="grid" id="grid"></div>
<div class="note">
  <b>处理说明：</b>32 张图片均按「脸居中」重新裁成正方形，所以无论是圆形头像还是卡片顶部的宽图，人脸都会留在可视区域。其中 Iga Swiatek、Andre Agassi、Ana Ivanovic、Martina Hingis 4 张因原图是侧脸/戴帽/全身照，面部检测未命中，改用「上半身/脸偏上」的通用 fallback 裁剪。若某张脸仍被切或不清晰，请直接告诉我类型+性别，我单独再调。
</div>
<script>
const M = [
 ["INTJ","Novak Djokovic","Maria Sharapova"],
 ["INTP","Daniil Medvedev","Iga Swiatek"],
 ["ENTJ","Roger Federer","Serena Williams"],
 ["ENTP","Carlos Alcaraz","Coco Gauff"],
 ["INFJ","Bjorn Borg","Billie Jean King"],
 ["INFP","Gael Monfils","Ana Ivanovic"],
 ["ENFJ","Andre Agassi","Venus Williams"],
 ["ENFP","Jo-Wilfried Tsonga","Ons Jabeur"],
 ["ISTJ","Andy Murray","Simona Halep"],
 ["ISFJ","Rafael Nadal","Naomi Osaka"],
 ["ESTJ","Pete Sampras","Steffi Graf"],
 ["ESFJ","Gustavo Kuerten","Caroline Wozniacki"],
 ["ISTP","Stan Wawrinka","Martina Hingis"],
 ["ISFP","Boris Becker","Ashleigh Barty"],
 ["ESTP","Jimmy Connors","Monica Seles"],
 ["ESFP","Andy Roddick","Anna Kournikova"]
];
const g = document.getElementById('grid');
M.forEach(([code,mname,fname])=>{
  ['male','female'].forEach((gender,i)=>{
    const name = i===0?mname:fname;
    const img = `../images/stars/${code}-${gender}.jpg`;
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `
      <div class="head">
        <span class="code">${code}</span>
        <span class="gender">${gender==='male'?'♂':'♀'}</span>
        <span class="name">${name}</span>
      </div>
      <div class="previews">
        <div class="preview">
          <div class="label">圆形头像</div>
          <div class="circle-wrap"><img src="${img}"></div>
        </div>
        <div class="preview" style="flex:1.6">
          <div class="label">卡片顶部</div>
          <div class="wide-wrap"><img src="${img}"></div>
        </div>
      </div>
      <div class="full"><img src="${img}"></div>
    `;
    g.appendChild(card);
  });
});
</script>
</body>
</html>
